<script>
const T = {
  h1: {en:'About Kamel Money',fr:'À propos de Kamel Money',de:'Über Kamel Money',cs:'O Kamel Money'},
  p1: {en:'Kamel Money was created to solve one simple problem: sending money abroad is too expensive and confusing.',fr:'Kamel Money a été créé pour résoudre un problème simple : envoyer de l’argent à l’étranger est trop cher et compliqué.',de:'Kamel Money wurde geschaffen, um ein einfaches Problem zu lösen: Geld ins Ausland zu senden ist zu teuer und verwirrend.',cs:'Kamel Money byl vytvořen k vyřešení jednoho jednoduchého problému: posílání peněz do zahraničí je příliš drahé a matoucí.'},
  h2_mission: {en:'Our Mission',fr:'Notre mission',de:'Unsere Mission',cs:'Naše mise'},
  p2: {en:'Millions of people send money to support family in countries like Tunisia, Morocco, Egypt, Algeria, and across Africa and Asia. Traditional banks and some transfer services charge high hidden fees and give poor exchange rates. We believe you deserve transparency.',fr:'Des millions de personnes envoient de l’argent pour soutenir leur famille dans des pays comme la Tunisie, le Maroc, l’Égypte, l’Algérie, et à travers l’Afrique et l’Asie. Les banques traditionnelles et certains services de transfert facturent des frais cachés élevés et donnent de mauvais taux de change. Nous pensons que vous méritez la transparence.',de:'Millionen von Menschen senden Geld, um Familien in Ländern wie Tunesien, Marokko, Ägypten, Algerien und in ganz Afrika und Asien zu unterstützen. Traditionelle Banken und einige Überweisungsdienste erheben hohe versteckte Gebühren und geben schlechte Wechselkurse. Wir glauben, Sie verdienen Transparenz.',cs:'Miliony lidí posílají peníze na podporu rodiny v zemích jako Tunisko, Maroko, Egypt, Alžírsko a po celé Africe a Asii. Tradiční banky a některé převodní služby účtují vysoké skryté poplatky a dávají špatné směnné kurzy. Věříme, že si zasloužíte transparentnost.'},
  h2_works: {en:'How It Works',fr:'Comment ça marche',de:'Wie es funktioniert',cs:'Jak to funguje'},
  p3: {en:'Kamel Money compares 7 trusted remittance operators in real-time: Wise, Remitly, Revolut, WorldRemit, Ria, MoneyGram, and Western Union. Our calculator shows you the exact fees, the real exchange rate, and the final amount your recipient will get. We update rates automatically using live mid-market data.',fr:'Kamel Money compare 7 opérateurs de transfert fiables en temps réel : Wise, Remitly, Revolut, WorldRemit, Ria, MoneyGram et Western Union. Notre calculateur vous montre les frais exacts, le vrai taux de change et le montant final que votre destinataire recevra. Nous mettons à jour les taux automatiquement avec des données de marché en direct.',de:'Kamel Money vergleicht 7 vertrauenswürdige Überweisungsanbieter in Echtzeit: Wise, Remitly, Revolut, WorldRemit, Ria, MoneyGram und Western Union. Unser Rechner zeigt Ihnen die genauen Gebühren, den echten Wechselkurs und den Endbetrag, den Ihr Empfänger erhält. Wir aktualisieren die Kurse automatisch mit Live-Marktdaten.',cs:'Kamel Money porovnává 7 důvěryhodných operátorů remitencí v reálném čase: Wise, Remitly, Revolut, WorldRemit, Ria, MoneyGram a Western Union. Naše kalkulačka vám ukáže přesné poplatky, skutečný směnný kurz a konečnou částku, kterou příjemce dostane. Kurzy aktualizujeme automaticky pomocí živých tržních dat.'},
  h2_free: {en:'100% Free & Independent',fr:'100% Gratuit & Indépendant',de:'100% Kostenlos & Unabhängig',cs:'100% Zdarma & Nezávislé'},
  p4: {en:'This tool is completely free to use. We do not charge you anything. We may receive a small commission if you choose to send money via one of our partner links, but this never affects the price you pay or our rankings. We show you the cheapest option first, always.',fr:'Cet outil est entièrement gratuit. Nous ne vous facturons rien. Nous pouvons recevoir une petite commission si vous choisissez d’envoyer de l’argent via l’un de nos liens partenaires, mais cela n’affecte jamais le prix que vous payez ni nos classements. Nous vous montrons toujours l’option la moins chère en premier.',de:'Dieses Tool ist völlig kostenlos. Wir berechnen Ihnen nichts. Wir erhalten möglicherweise eine kleine Provision, wenn Sie Geld über einen unserer Partnerlinks senden, aber dies beeinflusst niemals den Preis, den Sie zahlen, oder unsere Rankings. Wir zeigen Ihnen immer zuerst die günstigste Option.',cs:'Tento nástroj je zcela zdarma k použití. Nic vám neúčtujeme. Můžeme obdržet malou provizi, pokud se rozhodnete poslat peníze přes jeden z našich partnerských odkazů, ale to nikdy neovlivní cenu, kterou platíte, ani naše hodnocení. Vždy vám nejprve ukážeme nejlevnější možnost.'},
  h2_not: {en:'Not a Financial Institution',fr:'Pas une institution financière',de:'Keine Finanzinstitution',cs:'Nejsme finanční instituce'},
  p5: {en:'<b>Important:</b> Kamel Money is an information and comparison service only. We are not a bank, money transmitter, or financial advisor. We do not hold your money or process transfers. Always confirm the final fees and rates on the provider\'s official website before sending.',fr:'<b>Important :</b> Kamel Money est uniquement un service d’information et de comparaison. Nous ne sommes pas une banque, un transmetteur d’argent ou un conseiller financier. Nous ne détenons pas votre argent et ne traitons pas les transferts. Confirmez toujours les frais et taux finaux sur le site officiel du fournisseur avant d’envoyer.',de:'<b>Wichtig:</b> Kamel Money ist nur ein Informations- und Vergleichsdienst. Wir sind keine Bank, kein Geldübermittler oder Finanzberater. Wir halten Ihr Geld nicht und verarbeiten keine Überweisungen. Bestätigen Sie immer die endgültigen Gebühren und Kurse auf der offiziellen Website des Anbieters vor dem Senden.',cs:'<b>Důležité:</b> Kamel Money je pouze informační a srovnávací služba. Nejsme banka, převodce peněz ani finanční poradce. Nedržíme vaše peníze ani nezpracováváme převody. Před odesláním vždy potvrďte konečné poplatky a kurzy na oficiálních stránkách poskytovatele.'},
  contact_text: {en:'Questions? Contact us at:',fr:'Des questions? Contactez-nous à :',de:'Fragen? Kontaktieren Sie uns unter:',cs:'Otázky? Kontaktujte nás na:'},
