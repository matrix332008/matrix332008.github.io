<script>
const T = {
  h1: {en:'Privacy Policy for Kamel Money',fr:'Politique de confidentialité de Kamel Money',de:'Datenschutzerklärung für Kamel Money',cs:'Zásady ochrany osobních údajů Kamel Money'},
  date: {en:'Last updated: July 5, 2026',fr:'Dernière mise à jour : 5 juillet 2026',de:'Zuletzt aktualisiert: 5. Juli 2026',cs:'Poslední aktualizace: 5. července 2026'},
  p_intro: {en:'Welcome to Kamel Money ("we", "our", "us"). We are committed to protecting your privacy. This Privacy Policy explains how we collect, use, and share information when you use our website, Kamel Money.',fr:'Bienvenue sur Kamel Money (« nous », « notre »). Nous nous engageons à protéger votre vie privée. Cette politique de confidentialité explique comment nous collectons, utilisons et partageons les informations lorsque vous utilisez notre site web, Kamel Money.',de:'Willkommen bei Kamel Money ("wir", "uns"). Wir verpflichten uns, Ihre Privatsphäre zu schützen. Diese Datenschutzrichtlinie erklärt, wie wir Informationen sammeln, verwenden und weitergeben, wenn Sie unsere Website Kamel Money nutzen.',cs:'Vítejte v Kamel Money („my“, „naše“). Zavazujeme se chránit vaše soukromí. Tyto zásady ochrany osobních údajů vysvětlují, jak shromažďujeme, používáme a sdílíme informace, když používáte naši webovou stránku Kamel Money.'},
  h2_1: {en:'1. Information We Do Not Collect',fr:'1. Informations que nous ne collectons pas',de:'1. Informationen, die wir nicht sammeln',cs:'1. Informace, které neshromažďujeme'},
  p_1: {en:'Kamel Money is a free comparison tool. We do not require user registration, and we do not collect personally identifiable information such as your name, email address, phone number, or financial account details. All calculations are performed in your browser.',fr:'Kamel Money est un outil de comparaison gratuit. Nous n’exigeons pas d’inscription et nous ne collectons pas d’informations personnelles identifiables telles que votre nom, adresse e-mail, numéro de téléphone ou détails de compte financier. Tous les calculs sont effectués dans votre navigateur.',de:'Kamel Money ist ein kostenloses Vergleichstool. Wir benötigen keine Benutzerregistrierung und sammeln keine personenbezogenen Daten wie Ihren Namen, Ihre E-Mail-Adresse, Telefonnummer oder Finanzkontodaten. Alle Berechnungen werden in Ihrem Browser durchgeführt.',cs:'Kamel Money je bezplatný srovnávací nástroj. Nevyžadujeme registraci uživatele a neshromažďujeme osobně identifikovatelné informace, jako je vaše jméno, e-mailová adresa, telefonní číslo nebo údaje o finančním účtu. Všechny výpočty se provádějí ve vašem prohlížeči.'},
  h2_2: {en:'2. Information We Collect Automatically',fr:'2. Informations que nous collectons automatiquement',de:'2. Automatisch erfasste Informationen',cs:'2. Informace, které shromažďujeme automaticky'},
  p_2: {en:'When you use our service, we may automatically collect certain non-personal information through cookies and similar technologies. This includes:',fr:'Lorsque vous utilisez notre service, nous pouvons collecter automatiquement certaines informations non personnelles via des cookies et technologies similaires. Cela inclut :',de:'Wenn Sie unseren Service nutzen, erfassen wir möglicherweise automatisch bestimmte nicht-personenbezogene Informationen durch Cookies und ähnliche Technologien. Dazu gehören:',cs:'Když používáte naši službu, můžeme automaticky shromažďovat určité neosobní informace prostřednictvím souborů cookie a podobných technologií. Patří sem:'},
  li_2_1: {en:'<b>Usage Data:</b> Your IP address, browser type, device type, and pages visited. This helps us understand how our service is used and improve it.',fr:'<b>Données d’utilisation :</b> Votre adresse IP, type de navigateur, type d’appareil et pages visitées. Cela nous aide à comprendre comment notre service est utilisé et à l’améliorer.',de:'<b>Nutzungsdaten:</b> Ihre IP-Adresse, Browsertyp, Gerätetyp und besuchte Seiten. Dies hilft uns zu verstehen, wie unser Service genutzt wird, und ihn zu verbessern.',cs:'<b>Údaje o používání:</b> Vaše IP adresa, typ prohlížeče, typ zařízení a navštívené stránky. To nám pomáhá pochopit, jak je naše služba používána, a vylepšovat ji.'},
  li_2_2: {en:'<b>Preferences:</b> We use `localStorage` to save your language and number format preferences on your device. This data never leaves your browser.',fr:'<b>Préférences :</b> Nous utilisons `localStorage` pour enregistrer vos préférences de langue et de format de nombre sur votre appareil. Ces données ne quittent jamais votre navigateur.',de:'<b>Einstellungen:</b> Wir verwenden `localStorage`, um Ihre Sprach- und Zahlenformat-Einstellungen auf Ihrem Gerät zu speichern. Diese Daten verlassen niemals Ihren Browser.',cs:'<b>Předvolby:</b> Používáme `localStorage` k uložení vašich předvoleb jazyka a formátu čísel ve vašem zařízení. Tato data nikdy neopustí váš prohlížeč.'},
  h2_3: {en:'3. Cookies and Third-Party Services',fr:'3. Cookies et services tiers',de:'3. Cookies und Drittanbieterdienste',cs:'3. Soubory cookie a služby třetích stran'},
  p_3: {en:'We use third-party services that may place cookies on your device:',fr:'Nous utilisons des services tiers qui peuvent placer des cookies sur votre appareil :',de:'Wir nutzen Dienste von Drittanbietern, die möglicherweise Cookies auf Ihrem Gerät platzieren:',cs:'Používáme služby třetích stran, které mohou umístit soubory cookie do vašeho zařízení:'},
  li_3_1: {en:'<b>Google AdSense:</b> We use Google AdSense to display ads. Google uses cookies to serve ads based on your prior visits to our website or other websites. Google\'s use of advertising cookies enables it and its partners to serve ads to you based on your visit to our site and/or other sites on the Internet. You may opt out of personalized advertising by visiting <a href="https://www.google.com/settings/ads" target="_blank" rel="noopener">Google Ads Settings</a>.',fr:'<b>Google AdSense :</b> Nous utilisons Google AdSense pour afficher des publicités. Google utilise des cookies pour diffuser des annonces basées sur vos visites antérieures sur notre site ou d’autres sites. L’utilisation par Google des cookies publicitaires lui permet, ainsi qu’à ses partenaires, de vous proposer des annonces en fonction de votre visite sur notre site et/ou d’autres sites sur Internet. Vous pouvez désactiver la publicité personnalisée en visitant les <a href="https://www.google.com/settings/ads" target="_blank" rel="noopener">Paramètres Google Ads</a>.',de:'<b>Google AdSense:</b> Wir verwenden Google AdSense zur Anzeige von Werbung. Google verwendet Cookies, um Anzeigen basierend auf Ihren früheren Besuchen auf unserer Website oder anderen Websites zu schalten. Die Verwendung von Werbe-Cookies durch Google ermöglicht es ihm und seinen Partnern, Ihnen Anzeigen basierend auf Ihrem Besuch auf unserer und/oder anderen Websites im Internet zu schalten. Sie können personalisierte Werbung deaktivieren, indem Sie die <a href="https://www.google.com/settings/ads" target="_blank" rel="noopener">Google-Anzeigeneinstellungen</a> besuchen.',cs:'<b>Google AdSense:</b> Používáme Google AdSense k zobrazování reklam. Google používá soubory cookie k zobrazování reklam na základě vašich předchozích návštěv našich webových stránek nebo jiných webů. Používání reklamních souborů cookie společností Google umožňuje jí a jejím partnerům zobrazovat vám reklamy na základě vaší návštěvy našich stránek a/nebo jiných stránek na internetu. Personalizovanou reklamu můžete deaktivovat v <a href="https://www.google.com/settings/ads" target="_blank" rel="noopener">Nastavení reklam Google</a>.'},
  li_3_2: {en:'<b>Analytics:</b> We may use privacy-friendly analytics to collect anonymous usage data to improve our service. We do not track individuals.',fr:'<b>Analytique :</b> Nous pouvons utiliser des outils d’analyse respectueux de la vie privée pour collecter des données d’utilisation anonymes afin d’améliorer notre service. Nous ne suivons pas les individus.',de:'<b>Analytik:</b> Wir verwenden möglicherweise datenschutzfreundliche Analysen, um anonyme Nutzungsdaten zur Verbesserung unseres Dienstes zu sammeln. Wir verfolgen keine Einzelpersonen.',cs:'<b>Analytika:</b> Můžeme používat analytiku šetrnou k soukromí ke shromažďování anonymních údajů o používání ke zlepšení naší služby. Nesledujeme jednotlivce.'},
  p_3_2: {en:'You can instruct your browser to refuse all cookies or to indicate when a cookie is being sent. However, if you do not accept cookies, you may not be able to use some portions of our Service.',fr:'Vous pouvez configurer votre navigateur pour refuser tous les cookies ou pour indiquer quand un cookie est envoyé. Cependant, si vous n’acceptez pas les cookies, vous pourriez ne pas pouvoir utiliser certaines parties de notre Service.',de:'Sie können Ihren Browser anweisen, alle Cookies abzulehnen oder anzuzeigen, wenn ein Cookie gesendet wird. Wenn Sie jedoch keine Cookies akzeptieren, können Sie möglicherweise einige Teile unseres Dienstes nicht nutzen.',cs:'Můžete nastavit svůj prohlížeč tak, aby odmítal všechny soubory cookie nebo aby indikoval, když je soubor cookie odesílán. Pokud však soubory cookie nepřijmete, možná nebudete moci používat některé části naší Služby.'},
  h2_4: {en:'4. Affiliate Disclosure',fr:'4. Divulgation d’affiliation',de:'4. Offenlegung von Partnerprogrammen',cs:'4. Zveřejnění partnerských vztahů'},
  p_4: {en:'Kamel Money compares money transfer services. Some of the links to providers may be affiliate links. If you click on a partner link and complete a transfer, we may earn a commission. This comes at no extra cost to you and does not affect our comparison results or rankings. Our goal is to provide unbiased, transparent information.',fr:'Kamel Money compare des services de transfert d’argent. Certains liens vers des fournisseurs peuvent être des liens d’affiliation. Si vous cliquez sur un lien partenaire et effectuez un transfert, nous pouvons percevoir une commission. Cela n’entraîne aucun coût supplémentaire pour vous et n’affecte pas nos résultats de comparaison ou classements. Notre objectif est de fournir des informations impartiales et transparentes.',de:'Kamel Money vergleicht Geldtransferdienste. Einige der Links zu Anbietern können Affiliate-Links sein. Wenn Sie auf einen Partnerlink klicken und eine Überweisung abschließen, erhalten wir möglicherweise eine Provision. Dies verursacht keine zusätzlichen Kosten für Sie und beeinflusst nicht unsere Vergleichsergebnisse oder Rankings. Unser Ziel ist es, unvoreingenommene, transparente Informationen bereitzustellen.',cs:'Kamel Money porovnává služby převodu peněz. Některé odkazy na poskytovatele mohou být affiliate odkazy. Pokud kliknete na partnerský odkaz a dokončíte převod, můžeme získat provizi. To pro vás neznamená žádné další náklady a neovlivňuje naše výsledky srovnání ani hodnocení. Naším cílem je poskytovat nestranné a transparentní informace.'},
  h2_5: {en:'5. Data Security',fr:'5. Sécurité des données',de:'5. Datensicherheit',cs:'5. Zabezpečení dat'},
  p_5: {en:'The security of your data is important to us. Since we do not collect personal data, your risk is minimized. However, remember that no method of transmission over the Internet is 100% secure.',fr:'La sécurité de vos données est importante pour nous. Étant donné que nous ne collectons pas de données personnelles, votre risque est minimisé. Cependant, n’oubliez pas qu’aucune méthode de transmission sur Internet n’est sécurisée à 100 %.',de:'Die Sicherheit Ihrer Daten ist uns wichtig. Da wir keine personenbezogenen Daten sammeln, ist Ihr Risiko minimiert. Denken Sie jedoch daran, dass keine Übertragungsmethode über das Internet 100 % sicher ist.',cs:'Bezpečnost vašich dat je pro nás důležitá. Protože neshromažďujeme osobní údaje, je vaše riziko minimalizováno. Pamatujte však, že žádná metoda přenosu přes internet není 100% bezpečná.'},
  h2_6: {en:'6. Children\'s Privacy',fr:'6. Confidentialité des enfants',de:'6. Datenschutz von Kindern',cs:'6. Soukromí dětí'},
  p_6: {en:'Our Service does not address anyone under the age of 18. We do not knowingly collect personally identifiable information from children under 18.',fr:'Notre Service ne s’adresse à personne de moins de 18 ans. Nous ne collectons pas sciemment d’informations personnellement identifiables auprès d’enfants de moins de 18 ans.',de:'Unser Service richtet sich nicht an Personen unter 18 Jahren. Wir sammeln wissentlich keine personenbezogenen Daten von Kindern unter 18 Jahren.',cs:'Naše Služba není určena nikomu mladšímu 18 let. Vědomě neshromažďujeme osobně identifikovatelné informace od dětí mladších 18 let.'},
  h2_7: {en:'7. Links to Other Websites',fr:'7. Liens vers d’autres sites web',de:'7. Links zu anderen Websites',cs:'7. Odkazy na jiné webové stránky'},
  p_7: {en:'Our Service may contain links to other websites that are not operated by us. If you click on a third-party link, you will be directed to that third party\'s site. We strongly advise you to review the Privacy Policy of every site you visit. We have no control over and assume no responsibility for the content, privacy policies, or practices of any third-party sites or services.',fr:'Notre Service peut contenir des liens vers d’autres sites web qui ne sont pas exploités par nous. Si vous cliquez sur un lien tiers, vous serez dirigé vers le site de ce tiers. Nous vous conseillons vivement de consulter la politique de confidentialité de chaque site que vous visitez. Nous n’avons aucun contrôle et n’assumons aucune responsabilité quant au contenu, aux politiques de confidentialité ou aux pratiques des sites ou services tiers.',de:'Unser Service kann Links zu anderen Websites enthalten, die nicht von uns betrieben werden. Wenn Sie auf einen Link eines Drittanbieters klicken, werden Sie zur Website dieses Drittanbieters weitergeleitet. Wir empfehlen Ihnen dringend, die Datenschutzrichtlinie jeder Website, die Sie besuchen, zu überprüfen. Wir haben keine Kontrolle über und übernehmen keine Verantwortung für den Inhalt, die Datenschutzrichtlinien oder Praktiken von Websites oder Diensten Dritter.',cs:'Naše Služba může obsahovat odkazy na jiné webové stránky, které nejsou provozovány námi. Pokud kliknete na odkaz třetí strany, budete přesměrováni na stránky této třetí strany. Důrazně doporučujeme, abyste si přečetli Zásady ochrany osobních údajů každé stránky, kterou navštívíte. Nemáme žádnou kontrolu a nepřebíráme žádnou odpovědnost za obsah, zásady ochrany osobních údajů nebo praktiky jakýchkoli stránek nebo služeb třetích stran.'},
  h2_8: {en:'8. Changes to This Privacy Policy',fr:'8. Modifications de cette politique de confidentialité',de:'8. Änderungen dieser Datenschutzrichtlinie',cs:'8. Změny těchto Zásad ochrany osobních údajů'},
  p_8: {en:'We may update our Privacy Policy from time to time. We will notify you of any changes by posting the new Privacy Policy on this page. You are advised to review this Privacy Policy periodically for any changes.',fr:'Nous pouvons mettre à jour notre politique de confidentialité de temps à autre. Nous vous informerons de tout changement en publiant la nouvelle politique de confidentialité sur cette page. Il vous est conseillé de consulter périodiquement cette politique de confidentialité pour tout changement.',de:'Wir können unsere Datenschutzrichtlinie von Zeit zu Zeit aktualisieren. Wir werden Sie über Änderungen informieren, indem wir die neue Datenschutzrichtlinie auf dieser Seite veröffentlichen. Es wird empfohlen, diese Datenschutzrichtlinie regelmäßig auf Änderungen zu überprüfen.',cs:'Naše Zásady ochrany osobních údajů můžeme čas od času aktualizovat. O jakýchkoli změnách vás budeme informovat zveřejněním nových Zásad ochrany osobních údajů na této stránce. Doporučujeme vám pravidelně kontrolovat tyto Zásady ochrany osobních údajů kvůli případným změnám.'},
  h2_9: {en:'9. Contact Us',fr:'9. Nous contacter',de:'9. Kontaktieren Sie uns',cs:'9. Kontaktujte nás'},
  p_9: {en:'If you have any questions about this Privacy Policy, you can contact us:',fr:'Si vous avez des questions sur cette politique de confidentialité, vous pouvez nous contacter :',de:'Wenn Sie Fragen zu dieser Datenschutzrichtlinie haben, können Sie uns kontaktieren:',cs:'Máte-li jakékoli dotazy ohledně těchto Zásad ochrany osobních údajů, můžete nás kontaktovat:'},
  contact_text: {en:'Questions? Contact us at:',fr:'Des questions? Contactez-nous à :',de:'Fragen? Kontaktieren Sie uns unter:',cs:'Otázky? Kontaktujte nás na:'},
