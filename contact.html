<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - Kamel Money</title>
<meta name="description" content="Contact Kamel Money. Send us your feedback, questions, or partnership inquiries about our remittance fee comparison tool.">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter',sans-serif;background:#f6f7f3;color:#1a221d;margin:0;padding:24px;line-height:1.7;max-width:800px;margin:auto;padding-bottom:100px}
  h1{font-family:'Fraunces',serif;font-size:32px;margin-bottom:8px}
  h2{font-family:'Fraunces',serif;font-size:22px;margin-top:32px;margin-bottom:12px;border-bottom:1px solid #e3e6e1;padding-bottom:8px}
  a{color:#0d9a62;font-weight:600}
.card{background:#fff;border:1px solid #e3e6e1;border-radius:18px;padding:24px;box-shadow:0 4px 24px rgba(21,41,30,.07)}
.contact-box{background:#f6f7f3;border:1px solid #e3e6e1;border-radius:14px;padding:20px;margin:20px 0;text-align:center}
.contact-box b{font-size:18px;color:#0d9a62}
.note{color:#6b756f;font-size:14px;margin-top:24px;line-height:1.6}
.back-link{display:inline-block;margin-top:24px}
.bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid #e3e6e1}
.bottom-bar-inner{max-width:460px;margin:0 auto;display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.btab{border:0;background:transparent;font-size:11.5px;font-weight:700;color:#6b7870;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:4px 14px;border-radius:12px;text-decoration:none}
.btab.active{color:#0d9a62}
</style>
</head>
<body>
<div class="card">
  <h1 data-i18n="h1"></h1>
  <p data-i18n="p_intro"></p>

  <div class="contact-box">
    <p data-i18n="email_text"></p>
    <b>Matrix332008@gmail.com</b>
  </div>

  <h2 data-i18n="h2_expect"></h2>
  <p data-i18n="p_expect"></p>

  <h2 data-i18n="h2_provider"></h2>
  <p data-i18n="p_provider"></p>

  <h2 data-i18n="h2_press"></h2>
  <p data-i18n="p_press"></p>

  <div class="note">
    <b data-i18n="note_bold"></b> <span data-i18n="note_text"></span>
  </div>

  <a href="index.html" class="back-link" data-i18n="back"></a>
</div>

<div class="bottom-bar">
  <div class="bottom-bar-inner">
    <a class="btab" href="index.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>
      <span data-i18n="tab_compare"></span>
    </a>
    <a class="btab" href="settings.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 0 0 0.33 1.82l.06.06a2 2 0 1 0 2.83-2.83l-.06-.06a1.65 0 0 0-1.82-.33 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 0 0 0 9 19.4a1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 0 0 0 4.68 15a1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 0 0 0 4.6 9a1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 0 0 0 9 4.68a1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 0 0 0 1 1.51 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 0 0 0 19.4 9a1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 0 0 0-1.51 1z"/></svg>
      <span data-i18n="tab_settings"></span>
    </a>
    <a class="btab" href="about.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span data-i18n="tab_about"></span>
    </a>
  </div>
</div>

<script>
const T = {
  h1: {en:'Contact Us',fr:'Contactez-nous',de:'Kontakt',cs:'Kontaktujte nás'},
  p_intro: {en:'We\'d love to hear from you. Whether you have feedback, found a bug, have a question about our data, or want to discuss a partnership, please get in touch.',fr:'Nous serions ravis d’avoir de vos nouvelles. Que vous ayez des commentaires, trouvé un bug, une question sur nos données ou que vous souhaitiez discuter d’un partenariat, contactez-nous.',de:'Wir freuen uns, von Ihnen zu hören. Ob Sie Feedback haben, einen Fehler gefunden haben, eine Frage zu unseren Daten haben oder eine Partnerschaft besprechen möchten, kontaktieren Sie uns bitte.',cs:'Rádi od vás uslyšíme. Ať už máte zpětnou vazbu, našli jste chybu, máte dotaz ohledně našich dat nebo chcete projednat partnerství, ozvěte se nám.'},
  email_text: {en:'The best way to reach us is by email:',fr:'Le meilleur moyen de nous joindre est par e-mail :',de:'Der beste Weg, uns zu erreichen, ist per E-Mail:',cs:'Nejlepší způsob, jak nás kontaktovat, je e-mailem:'},
  h2_expect: {en:'What to expect',fr:'À quoi s’attendre',de:'Was Sie erwartet',cs:'Co očekávat'},
  p_expect: {en:'We read every email and try to respond within 3-5 business days. As a small independent project, we appreciate your patience.',fr:'Nous lisons chaque e-mail et essayons de répondre sous 3 à 5 jours ouvrés. En tant que petit projet indépendant, nous apprécions votre patience.',de:'Wir lesen jede E-Mail und versuchen, innerhalb von 3-5 Werktagen zu antworten. Als kleines unabhängiges Projekt schätzen wir Ihre Geduld.',cs:'Čteme každý e-mail a snažíme se odpovědět do 3-5 pracovních dnů. Jako malý nezávislý projekt si vážíme vaší trpělivosti.'},
  h2_provider: {en:'For Provider Inquiries',fr:'Pour les demandes des fournisseurs',de:'Für Anbieteranfragen',cs:'Pro dotazy poskytovatelů'},
  p_provider: {en:'If you represent a money transfer service and would like to be listed on Kamel Money or update your fee information, please email us with the subject line "Provider Partnership".',fr:'Si vous représentez un service de transfert d’argent et souhaitez être listé sur Kamel Money ou mettre à jour vos informations de frais, veuillez nous envoyer un e-mail avec l’objet "Provider Partnership".',de:'Wenn Sie einen Geldtransferdienst vertreten und auf Kamel Money gelistet werden oder Ihre Gebühreninformationen aktualisieren möchten, senden Sie uns bitte eine E-Mail mit der Betreffzeile "Provider Partnership".',cs:'Pokud zastupujete službu pro převod peněz a chtěli byste být uvedeni na Kamel Money nebo aktualizovat informace o poplatcích, pošlete nám e-mail s předmětem "Provider Partnership".'},
  h2_press: {en:'For Press & Media',fr:'Pour la presse et les médias',de:'Für Presse & Medien',cs:'Pro tisk a média'},
  p_press: {en:'For all press and media inquiries, please use the subject line "Press Inquiry" to help us route your email faster.',fr:'Pour toutes les demandes de presse et médias, veuillez utiliser l’objet "Press Inquiry" pour nous aider à acheminer votre e-mail plus rapidement.',de:'Für alle Presse- und Medienanfragen verwenden Sie bitte die Betreffzeile "Press Inquiry", damit wir Ihre E-Mail schneller weiterleiten können.',cs:'Pro všechny dotazy tisku a médií použijte prosím předmět "Press Inquiry", abychom mohli váš e-mail rychleji nasměrovat.'},
  note_bold: {en:'Please note:',fr:'Veuillez noter :',de:'Bitte beachten Sie:',cs:'Upozornění:'},
  note_text: {en:'Kamel Money is an information and comparison service only. We are not a bank or money transmitter. We cannot help with individual transfers, trace payments, or resolve issues with a specific provider. For help with a transfer you made, please contact that provider\'s customer support directly.',fr:'Kamel Money est uniquement un service d’information et de comparaison. Nous ne sommes pas une banque ni un transmetteur d’argent. Nous ne pouvons pas aider avec des transferts individuels, tracer des paiements ou résoudre des problèmes avec un fournisseur spécifique. Pour obtenir de l’aide concernant un transfert que vous avez effectué, contactez directement le service client de ce fournisseur.',de:'Kamel Money ist nur ein Informations- und Vergleichsdienst. Wir sind keine Bank oder Geldübermittler. Wir können nicht bei einzelnen Überweisungen helfen, Zahlungen nachverfolgen oder Probleme mit einem bestimmten Anbieter lösen. Für Hilfe bei einer von Ihnen getätigten Überweisung wenden Sie sich bitte direkt an den Kundendienst dieses Anbieters.',cs:'Kamel Money je pouze informační a srovnávací služba. Nejsme banka ani převodce peněz. Nemůžeme pomoci s jednotlivými převody, sledovat platby ani řešit problémy s konkrétním poskytovatelem. S pomocí ohledně převodu, který jste provedli, se obraťte přímo na zákaznickou podporu daného poskytovatele.'},
  back: {en:'← Back to Kamel Money',fr:'← Retour à Kamel Money',de:'← Zurück zu Kamel Money',cs:'← Zpět na Kamel Money'},
  tab_compare: {en:'Compare',fr:'Comparer',de:'Vergleich',cs:'Porovnat'},
  tab_settings: {en:'Settings',fr:'Réglages',de:'Einstellungen',cs:'Nastavení'},
  tab_about: {en:'About',fr:'À propos',de:'Über',cs:'O aplikaci'}
};

const lang = localStorage.getItem('km_lang') || 'en';
document.documentElement.lang = lang;

document.querySelectorAll('[data-i18n]').forEach(el=>{
  const key = el.getAttribute('data-i18n');
  if(T[key] && T[key]) el.innerHTML = T[key];
});
</script>
</body>
</html>
